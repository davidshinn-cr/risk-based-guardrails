<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk-Based Guardrails Retirement Calculator</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0; --surface-1: #fcfcfb; --border: #e2e0da; --grid: #ebe9e4;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --accent: #2a78d6; --accent-ink: #1c5cab;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-4: #2a78d6; --seq-6: #184f95;
  --series-2: #eb6834; --series-3: #1baf7a;
  --good: #0ca30c; --critical: #d03b3b; --warning: #b77f00;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --accent: #3987e5; --accent-ink: #86b6ef;
    --seq-1: #18304f; --seq-2: #1c5cab; --seq-4: #3987e5; --seq-6: #9ec5f4;
    --series-2: #d95926; --series-3: #199e70; --warning: #fab219;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--surface-0); color: var(--text-primary); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--surface-1); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 650; }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 1px solid var(--border); background: transparent; color: var(--text-secondary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.spacer { flex: 1; }
button.btn { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
button.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
main { display: grid; grid-template-columns: 340px 1fr; gap: 0; min-height: calc(100vh - 52px); }
aside { border-right: 1px solid var(--border); background: var(--surface-1); padding: 10px 14px 40px; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
fieldset { border: none; margin: 0 0 6px; padding: 0; }
legend { font-weight: 650; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); padding: 10px 0 4px; }
.row { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 8px; margin: 3px 0; }
.row.wide { grid-template-columns: 1fr; }
.row label { color: var(--text-secondary); font-size: 13px; }
.row label code { font-size: 11px; color: var(--text-muted); }
input, select { width: 100%; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-0); color: var(--text-primary); font: inherit; font-variant-numeric: tabular-nums; }
.help { font-size: 11.5px; color: var(--text-muted); margin: 0 0 4px; }
section.out { padding: 16px 22px 60px; overflow-x: hidden; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 10px 0 16px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--text-secondary); }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.tile .s { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.card .sub { color: var(--text-secondary); font-size: 12.5px; margin: 0 0 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 1250px) { .grid2 { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
.err { color: var(--critical); font-weight: 600; margin: 8px 0; }
.note { color: var(--text-secondary); font-size: 12.5px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-secondary); font-size: 11px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 3; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 650; }
.legendrow { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 2px 0 6px; }
.sw { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.progress { height: 3px; background: var(--accent); width: 0; transition: width .1s; position: fixed; top: 0; left: 0; z-index: 9; }
.pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11.5px; font-weight: 600; }
.pill.up { color: var(--good); } .pill.down { color: var(--critical); } .pill.init { color: var(--accent-ink); }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; margin: 6px 0; }
.modehdr { font-size: 13px; font-weight: 650; color: var(--text-secondary); margin: 18px 0 0; text-transform: uppercase; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header>
  <h1>Risk-Based Guardrails Calculator</h1>
  <div class="tabs" id="tabs">
    <button data-tab="plan">Planner (backtest)</button>
    <button data-tab="sim">Guardrails simulation</button>
    <button data-tab="about">How it works</button>
  </div>
  <div class="spacer"></div>
  <span class="note" id="status"></span>
  <button class="btn" id="copy">Copy link</button>
  <button class="btn" id="reset">Reset</button>
</header>
<main>
  <aside id="form"></aside>
  <section class="out">
    <div id="err"></div>
    <div id="out-plan"></div>
    <div id="out-sim"></div>
    <div id="out-about"></div>
  </section>
</main>
<div class="tip" id="tip"></div>

<script id="engine-src">/* Retirement engine. All amounts are REAL (today's dollars); inflation is handled by
   converting historical nominal returns to real returns. Withdrawals/contributions occur at
   the start of each year, then the portfolio earns that year's return.

   Key trick: with spending = L * a[k] + c[k] (L = adjustable spending level), the "can I fund
   every year?" test on one historical sequence is linear in L and in the starting portfolio P,
   so the critical spending level (or critical portfolio) per sequence is computed exactly in O(H).
   Success rate at (P, L) = share of historical sequences whose critical L >= L. */
var Engine = (function () {
  function realReturns(data, alloc, fee, cashReal) {
    var tot = alloc.s + alloc.b + alloc.c;
    var ws = alloc.s / tot, wb = alloc.b / tot, wc = alloc.c / tot;
    var out = new Float64Array(data.length);
    for (var i = 0; i < data.length; i++) {
      var d = data[i];
      var inf = d.inf;
      var rs = (1 + d.stocks) / (1 + inf) - 1;
      var rb = (1 + d.bonds) / (1 + inf) - 1;
      var rc = (d.cash != null && !isNaN(d.cash)) ? (1 + d.cash) / (1 + inf) - 1 : cashReal;
      var r = ws * rs + wb * rb + wc * rc;
      out[i] = (1 + r) * (1 - fee) - 1;
    }
    return out;
  }

  function buildScenario(p) {
    var N = p.pa1 - p.a1;
    if (p.a2 != null) N = Math.max(N, p.pa2 - p.a2);
    N = Math.max(1, Math.round(N));
    var mh = Math.max(0, Math.round(p.mh || 0)), Next = N + mh;
    var a = new Float64Array(Next), c = new Float64Array(Next), dchg = new Float64Array(Next),
      inc = new Float64Array(Next), retired = new Uint8Array(Next), age1 = [], age2 = [];
    var firstRet = -1;
    for (var k = 0; k < Next; k++) {
      var g1 = p.a1 + k, g2 = p.a2 != null ? p.a2 + k : null;
      age1.push(g1); age2.push(g2);
      var ret = g1 >= p.ra;
      retired[k] = ret ? 1 : 0;
      if (ret && firstRet < 0 && k < N) firstRet = k;
      var ss = 0;
      for (var i = 0; i < p.ss.length; i++) {
        var s = p.ss[i];
        var ag = s.who === 2 ? g2 : g1;
        if (ag != null && ag >= s.age) ss += s.amt;
      }
      inc[k] = ss;
      var lump = 0;
      for (i = 0; i < p.lumps.length; i++) if (p.lumps[i].age === g1) lump += p.lumps[i].amt;
      if (ret) {
        var pct = 0, dol = 0;
        for (i = 0; i < p.chg.length; i++) {
          var ch = p.chg[i];
          if (g1 >= ch.from && (ch.to == null || g1 < ch.to)) {
            if (ch.pct) pct += ch.amt; else dol += ch.amt;
          }
        }
        a[k] = Math.max(0, 1 + pct);
        dchg[k] = dol;
        c[k] = dol - ss - lump;
      } else {
        var contrib = p.contrib * Math.pow(1 + p.cg, k);
        a[k] = 0;
        c[k] = -contrib - ss - lump;
      }
    }
    return { N: N, mh: mh, Next: Next, a: a, c: c, dchg: dchg, inc: inc, retired: retired, firstRet: firstRet, age1: age1, age2: age2 };
  }

  // critical spending level for one historical sequence starting at hist index s,
  // from scenario year k with portfolio P, horizon H = N - k
  function hz(k, sc) { return Math.max(sc.N - k, sc.mh); }
  function critL(P, k, sc, r, s) {
    var H = hz(k, sc), inv = 1, A = 0, C = 0, best = Infinity;
    for (var j = 0; j < H; j++) {
      A += sc.a[k + j] * inv;
      C += sc.c[k + j] * inv;
      var room = P - C;
      if (A > 1e-12) { var v = room / A; if (v < best) best = v; }
      else if (room < -1e-9) return -Infinity;
      inv /= (1 + r[s + j]);
    }
    return best;
  }
  function critP(L, k, sc, r, s) {
    var H = hz(k, sc), inv = 1, need = 0, best = 0;
    for (var j = 0; j < H; j++) {
      need += (L * sc.a[k + j] + sc.c[k + j]) * inv;
      if (need > best) best = need;
      inv /= (1 + r[s + j]);
    }
    return best;
  }
  function nSeq(Y, H) { return Y - H + 1; }

  function distL(P, k, sc, r, out) {
    var H = hz(k, sc), n = nSeq(r.length, H);
    for (var s = 0; s < n; s++) out[s] = critL(P, k, sc, r, s);
    return n;
  }
  // largest L whose success rate >= p, from n critical levels in buf (buf is sorted in place)
  function levelAt(buf, n, p) {
    var arr = buf.subarray(0, n);
    arr.sort(); // ascending
    var need = Math.ceil(p * n - 1e-9); // number of sequences that must survive
    if (need < 1) need = 1;
    if (need > n) need = n;
    var v = arr[n - need];
    return v;
  }
  function successAt(buf, n, L) {
    var ok = 0;
    for (var i = 0; i < n; i++) if (buf[i] >= L - 1e-6) ok++;
    return ok / n;
  }

  /* ---------- Planner (historical backtest from today) ---------- */
  function plan(p, data) {
    var r = realReturns(data, p.alloc, p.fee, p.cashReal);
    var sc = buildScenario(p);
    var Y = r.length;
    if (hz(0, sc) > Y) return { error: "Horizon of " + sc.N + " years exceeds " + Y + " years of data." };
    var n = nSeq(Y, hz(0, sc));
    var buf = new Float64Array(n);
    distL(p.p0, 0, sc, r, buf);
    var Ls = Array.prototype.slice.call(buf);
    var sr = successAt(buf, n, p.spend);
    var maxSpend = levelAt(buf, n, p.tgt);
    var Ps = [];
    for (var s = 0; s < n; s++) Ps.push(critP(p.spend, 0, sc, r, s));
    var sortedP = Ps.slice().sort(function (x, y) { return x - y; });
    var needP = sortedP[Math.max(0, Math.ceil(p.tgt * n - 1e-9) - 1)];
    // per-sequence paths at chosen spend
    var paths = [], ends = [];
    for (s = 0; s < n; s++) {
      var P = p.p0, path = [], failed = -1;
      for (var k = 0; k < sc.N; k++) {
        P -= (sc.retired[k] ? p.spend * sc.a[k] : 0) + sc.c[k];
        if (P < 0 && failed < 0) failed = k;
        if (P < 0) P = 0;
        P *= 1 + r[s + k];
        path.push(P);
      }
      paths.push(path); ends.push({ year: data[s].year, end: P, failed: failed, maxSpend: Ls[s], needP: Ps[s] });
    }
    // success vs spend curve
    var sortedL = Ls.slice().sort(function (x, y) { return x - y; });
    return { N: sc.N, n: n, success: sr, maxSpend: Math.max(0, maxSpend), needP: needP, ends: ends, paths: paths,
      sortedL: sortedL, sc: { age1: sc.age1, firstRet: sc.firstRet, inc: Array.from(sc.inc), a: Array.from(sc.a), dchg: Array.from(sc.dchg) },
      firstYear: data[0].year, lastYear: data[Y - 1].year };
  }

  /* ---------- Guardrails Monte Carlo ---------- */
  function rng(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5; var x = t;
      x = Math.imul(x ^ (x >>> 15), x | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makePath(N, Y, p, rand, out) {
    if (p.rm === "block") {
      var bl = Math.max(1, Math.min(p.bl, Y)), k = 0;
      while (k < N) {
        var st = Math.floor(rand() * (Y - bl + 1));
        for (var j = 0; j < bl && k < N; j++, k++) out[k] = st + j;
      }
    } else {
      var st2;
      if (p.wrap || N > Y) { st2 = Math.floor(rand() * Y); for (var i = 0; i < N; i++) out[i] = (st2 + i) % Y; }
      else { st2 = Math.floor(rand() * (Y - N + 1)); for (i = 0; i < N; i++) out[i] = st2 + i; }

function renderAbout() {

  "<p><b>Planner.</b> Works like FI Calc's backtest, starting today. Every historical period as long as your horizon (today until both of you reach your planning ages) is replayed: deposits until retirement, then spending minus Social Security drawn from the portfolio at the start of each year. Spending changes and lump sums apply at person 1's age. The <i>success rate</i> is the share of periods that never run out. Because the plan is linear in spending and in starting portfolio, the tool solves exactly for (a) the highest base spending that hits your target success rate and (b) the starting portfolio needed for your spending at that rate.</p>" +
  "<p><b>Guardrails simulation</b> (risk-based guardrails, Kitces / Income Lab, 2024 parameters by default). Each simulated life gets its own sequence of real returns, built either by splicing random historical blocks or by taking one whole historical period. Each year of retirement:</p><ol>" +
  "<li>Ages, years remaining, Social Security start dates and planned spending changes are all moved forward.</li>" +
  "<li>The remaining plan, at the current spending level, is backtested over every historical period of the remaining length. This gives the current success rate.</li>" +
  "<li>If success ≥ the upper guardrail (100%), spending is raised to the level that gives 80%. If success ≤ the lower guardrail (25%), it is cut to the level that gives 45%. Otherwise spending just keeps pace with inflation, so it stays the same in today's dollars.</li>" +
  "<li>The year's spending is withdrawn and the portfolio earns that simulated year's return.</li></ol>" +
  "<p><i>Set at retirement</i> sets the starting spending, at the 80% level, from each life's own portfolio on retirement day. <i>Locked in today</i> sets it now, from today's portfolio plus planned deposits; guardrails take over once you retire.</p>" +
  "<p><b>Near the end of the plan</b> the remaining horizon gets short, the success rate climbs toward 100%, and the method raises spending to draw the portfolio down. That is how the method is designed, with the planning age as a hard stop. To be more conservative, set <code>mh</code> (min. years in success test) so the test always looks at least that many years ahead, or raise the planning ages.</p>" +
  "<p><b>Conventions.</b> Everything is in today's dollars. Historical nominal returns are converted to real using CPI, and Social Security and spending rise with inflation. Returns are annual, the portfolio is rebalanced yearly, and the fee is taken from returns. Taxes are not modeled. A surplus (Social Security above spending) is reinvested. Social Security starts at the stated age while both spouses are alive. Survivor benefits are not modeled, since the planning age is fixed.</p>" +
  "<p><b>Data.</b> Damodaran (NYU Stern) annual returns 1928–2025: S&P 500 with dividends, 3-month T-bill and 10-year T-bond. Inflation is Dec–Dec CPI-U (Shiller's CPI series through 2022, BLS for 2023–2025). Shiller 1871–2022 provides S&P total return and 10-year Treasury returns derived from GS10, January to January. Shiller has no T-bill series, so cash in those years uses the <code>cr</code> real return. Tip: <code>y0</code>/<code>y1</code> limit the years used.</p></div>";
}

/* ---------------- main loop ---------------- */
function setTab(t) {
  state.tab = t;
  document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === t); });
  ["plan", "sim", "about"].forEach(function (k) { document.getElementById("out-" + k).style.display = k === t ? "" : "none"; });
  writeURL(); refresh(true);
}
var simDirty = true;
function changed() { writeURL(); simDirty = true; refresh(false); }
function refresh(immediate) {
  document.getElementById("customrow").style.display = state.ds === "custom" ? "" : "none";
  var ep = engineParams(), data = dataset(); CUR_DATA = data;
  var errBox = document.getElementById("err");
  var hard = ep.errs.filter(function (e) { return e.indexOf("Note:") !== 0; });
  if (!data.length) hard.push("No historical data in the selected dataset/years" + (state.ds === "custom" ? " – load a CSV." : "."));
  errBox.innerHTML = ep.errs.concat(data.length ? [] : ["No data."]).map(function (e) { return '<div class="' + (e.indexOf("Note:") === 0 ? "note" : "err") + '">' + esc(e) + "</div>"; }).join("");
  if (hard.length) return;
  if (state.tab === "plan") renderPlan(ep.p, data);
  else if (state.tab === "sim") {
    if (simDirty) { clearTimeout(simTimer); simTimer = setTimeout(function () { simDirty = false; runSim(ep.p, data); }, immediate ? 0 : 500); }
    else renderSim();
  } else renderAbout();
}
document.querySelectorAll("#tabs button").forEach(function (b) { b.addEventListener("click", function () { setTab(b.dataset.tab); }); });
document.getElementById("copy").addEventListener("click", function () {
  var u = location.href; var done = function () { document.getElementById("status").textContent = "Link copied"; };
  if (navigator.clipboard) navigator.clipboard.writeText(u).then(done, function () { prompt("Copy this link:", u); }); else prompt("Copy this link:", u);
});
document.getElementById("reset").addEventListener("click", function () { history.replaceState(null, "", location.pathname + "?tab=" + state.tab); readURL(); buildForm(); changed(); });
var rz; addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (state.tab === "plan") refresh(true); else if (state.tab === "sim") renderSim(); }, 200); });
readURL(); buildForm(); setTab(state.tab);
</script>
</body>
